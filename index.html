"1. Dusk — At assembly, principal Bepo Adewale breaks down in tears and cannot speak. Vice Principal Mrs Apeh and the MD, Mrs Gloss, send him home with the counsellor.",
"2. The Enticement — Bepo explains that his wife Seri and their two children are in the UK and he must join them. He loves Stardom, but the pay abroad is far higher.",
"3. Migration Tales — Bepo thinks about the realities of life abroad. He hears success stories and hardship stories, and recalls Mr Nku, who vanished with a cooperative loan.",
"4. A Case of Visa Denied — Mrs Ignatius calls late at night about her family’s refused visas, which are tied to a DNA test. Bepo hears her, and a subplot about Bibi’s fear of a teacher’s tribal marks follows.",
"5. Snake in the Roof — The MD finds staff cars parked on school land and learns that cooperative loans paid for them. The board caps loans and tightens control.",
"6. Ade as Well as Jide — On Open Day a parent complains about a teacher’s grammar. The MD wrongly blames Mr Fafore, but Bepo shows he was right.",
"7. ‘Ritualists’ — Bepo remembers his time at Beesway Group of Schools and a frightening night when he saw the director and others bury a cow. He also recalls his failed school, Fruitful Future.",
"8. Missions Unaccomplished — Prefect elections begin. A speech by Banky insults Tosh’s father, Chief Ogba, and starts a family feud. Bepo worries about the Invention Club’s Breath Project.",
"9. Laughing Waterfalls — The school’s excursions are described, including waterfalls and Badagry. Bepo links the slave trade to today’s ‘japa’.",
"10. Passport Pains — Bepo struggles to renew his passport. He deals with corruption, agents like Tai, and NIN problems, even travelling to Ibadan.",
"11. Point of No Return — Stardom holds a farewell: a football match, an arts versus sciences debate and a cultural display. The MD gives Bepo a $10,000 cheque and he weeps.",
"12. Dawn — Bepo leaves for the airport with the support of his neighbours. After he leaves, the school feels his absence, then he returns, saying his heart is at Stardom."]},
"Things Fall Apart":{label:"Chapter",note:"Short chapter notes. Match them with your edition.",items:[
"1. Okonkwo is a famous wrestler in Umuofia who fears being weak like his father Unoka.",
"2. Mbaino must pay for a killed Umuofian woman. Okonkwo takes charge of the boy Ikemefuna.",
"3. The story goes back to Unoka’s debts and to Okonkwo’s hard start as a farmer.",
"4. Okonkwo breaks the Week of Peace by beating his wife and is punished.",
"5. The New Yam feast is held. Okonkwo’s temper again shows, and Ikemefuna settles into the household.",
"6. A wrestling contest is held. Ekwefi and her daughter Ezinma are shown, and the priestess Chielo praises Ezinma.",
"7. Ikemefuna is killed on the elders’ order, and Okonkwo strikes the fatal blow.",
"8. Okonkwo is sad. Obierika questions the killing, and Obierika’s daughter’s suitors visit.",
"9. Ezinma falls ill and Okonkwo helps. Ekwefi’s ogbanje fear is explained.",
"10. The egwugwu judge a case between Uzowulu and his wife’s family.",
"11. Chielo takes Ezinma to the cave at night, and Ekwefi follows.",
"12. The bride-price ceremony for Akueke is held.",
"13. At Ezeudu’s funeral, Okonkwo’s gun explodes and kills a boy. He is exiled for seven years.",
"14. The family arrives in Mbanta. Uchendu welcomes them and teaches Okonkwo about motherhood.",
"15. Obierika visits and tells of the destruction of Abame by white men.",
"16. Missionaries arrive at Mbanta and the first converts join them.",
"17. Nwoye is drawn to the new faith. The church is given land in the Evil Forest.",
"18. The church grows, as outcasts join it. Nothing happens to the missionaries in the Evil Forest.",
"19. Okonkwo’s exile ends, and he holds a feast for his mother’s kinsmen.",
"20. Okonkwo returns to Umuofia and finds it changed by the church, school and trade.",
"21. Mr Brown builds trust with the people. Reverend Smith takes over and is strict.",
"22. Enoch unmasks an egwugwu. The clan burns the church in revenge.",
"23. The District Commissioner tricks Okonkwo and other leaders, arrests them, and humiliates them.",
"24. The leaders are released after a fine. At a meeting, Okonkwo kills a court messenger.",
"25. The Commissioner finds Okonkwo’s body. He plans to give the story only a paragraph in his book."]},
"Arrow of God":{label:"Stage",items:[
"1. Ezeulu, chief priest of Ulu, announces the feast days and faces rivals such as Nwaka and Ezidemili.",
"2. In a land quarrel with Okperi, Ezeulu tells the truth and goes against his own people. Winterbottom steps in.",
"3. Captain Winterbottom offers Ezeulu a post as warrant chief. Ezeulu refuses and is detained.",
"4. Ezeulu’s absence upsets the feast calendar. His son Oduche locks a sacred python in a box.",
"5. Back home, Ezeulu refuses to name the day for the New Yam feast.",
"6. The harvest rots, and the hungry people take offerings to the Christian church.",
"7. Obika dies after a funeral ritual. Ezeulu loses his mind and ends alone."]},
"No Longer at Ease":{label:"Stage",items:[
"1. Obi Okonkwo stands trial for taking a bribe and everyone asks why.",
"2. Flashback: the Umuofia Progressive Union pays for Obi to study English in England.",
"3. Obi returns to Lagos and takes a job at the Scholarship Board with high ideals.",
"4. He loves Clara, an osu, but his parents oppose the marriage.",
"5. Debts and family demands grow, and his mother dies while he is away.",
"6. He starts accepting small gifts that become bribes, and Clara leaves him.",
"7. He is caught in a bribery trap and is judged by society."]},
"A Man of the People":{label:"Stage",items:[
"1. Odili Samalu meets his old teacher, Chief Nanga, who is now Minister of Culture.",
"2. Odili visits Nanga in the capital and sees his luxury and corruption.",
"3. Nanga takes Odili’s girlfriend, Elsie, so Odili wants revenge.",
"4. Odili joins Max and the Common People’s Convention to challenge Nanga.",
"5. He courts Edna, Nanga’s intended bride, while the campaign turns violent.",
"6. Max is killed and Nanga’s party wins the election by force.",
"7. A military coup ends the government."]},
"Purple Hibiscus":{label:"Stage",items:[
"1. On Palm Sunday, Jaja refuses communion and Papa’s anger breaks the family’s peace.",
"2. Flashback to Kambili’s strict life in Enugu under the pious but violent Eugene.",
"3. In Nsukka, Aunty Ifeoma’s home brings laughter, Papa-Nnukwu and Father Amadi.",
"4. Papa punishes Kambili harshly when he learns she stayed with Papa-Nnukwu.",
"5. Ifeoma faces trouble at the university, and Jaja grows bolder.",
"6. Mama poisons Eugene, and Jaja takes the blame and goes to prison.",
"7. Later, Kambili hopes for Jaja’s release and new beginnings."]},
"Half of a Yellow Sun":{label:"Stage",items:[
"1. In the early 1960s, Ugwu becomes houseboy to Odenigbo at Nsukka and Olanna moves in.",
"2. Kainene meets Richard, and violence against Igbo people in the north changes everything.",
"3. Biafra is declared and the family flees Nsukka.",
"4. Hunger and bombing worsen, and Ugwu is forced into the army.",
"5. Odenigbo’s affair with Amala and other betrayals strain the couples.",
"6. Kainene disappears while trading across enemy lines, and Olanna and Richard search for her.",
"7. Biafra loses, and Ugwu writes The World Was Silent When We Died."]},
"Americanah":{label:"Stage",items:[
"1. In a hair salon in the US, Ifemelu decides to return to Nigeria.",
"2. In Lagos, Ifemelu and Obinze fall in love as teenagers.",
"3. Ifemelu leaves for the US and faces hardship and racism.",
"4. She starts a blog about race, and her relationships with Curt and Blaine shape her.",
"5. Obinze fails to settle in Britain, is deported, and later becomes rich in Lagos.",
"6. Ifemelu returns to Nigeria and works at a magazine.",
"7. Ifemelu and Obinze meet again and rebuild their love."]},
"The Joys of Motherhood":{label:"Stage",items:[
"1. Nnu Ego is the daughter of Agbadi. Her first marriage to Amatokwu fails because she has no child.",
"2. She marries Nnaife and moves to Lagos, where she faces poverty and loses a baby.",
"3. She has more children while Nnaife works for the Meers and is later sent to war.",
"4. Co-wife Adaku joins the household, and rivalry over children and money grows.",
"5. Her sons study, but Nnu Ego is left with little help.",
"6. Nnu Ego dies alone by the roadside, then her children hold a grand funeral."]},
"Second-Class Citizen":{label:"Stage",items:[
"1. Adah is a girl in Lagos who longs for school and wins a place.",
"2. She marries Francis, and they go to London.",
"3. They face racism and poor housing, and Francis will not support the family.",
"4. Adah works at a library and raises the children.",
"5. Francis burns her manuscript, and Adah finally leaves him."]},
"Efuru":{label:"Stage",items:[
"1. Efuru marries Adizua against her father’s wishes, and their baby daughter dies.",
"2. Adizua leaves her, and she marries Gilbert and becomes a trader.",
"3. Gilbert is unfaithful and later accuses her, so she leaves him.",
"4. Efuru is linked to the lake goddess Uhamiri and stays childless but independent."]},
"The Palm-Wine Drinkard":{label:"Stage",items:[
"1. The Drinkard loses his tapster when he falls from a palm tree.",
"2. He leaves home to find him in Deads’ Town.",
"3. He meets the Complete Gentleman, who is really a skull, and other strange spirits.",
"4. After many adventures he returns home with a gift that ends the famine."]},
"Weep Not, Child":{label:"Stage",items:[
"1. Njoroge dreams of education while his father Ngotho works on Howlands’ land.",
"2. He goes to school, and his friendship with Mwihaki grows.",
"3. The Mau Mau struggle begins, and his brother Boro joins.",
"4. The Emergency brings violence and breaks the family.",
"5. Njoroge’s hopes fade as he sees what the struggle has cost."]},
"The River Between":{label:"Stage",items:[
"1. Two ridges, Kameno and Makuyu, face each other across the river Honia, and Chege prepares Waiyaki.",
"2. Joshua leads the mission, and Muthoni dies after her circumcision.",
"3. Waiyaki builds schools, and Kabonyi turns against him.",
"4. His love for Nyambura puts him in conflict with the Kiama council.",
"5. Waiyaki is tried and the ridges stay divided."]},
"Petals of Blood":{label:"Stage",items:[
"1. Four people in Ilmorog are questioned after a murder.",
"2. Munira, Wanja, Karega and Abdulla each arrive and settle in the village.",
"3. Drought drives a journey to Nairobi to seek help.",
"4. Ilmorog changes as wealthy men take control of its land and trade.",
"5. A fire kills three brewery directors, and the story ends with the suspects’ confessions."]},
"So Long a Letter":{label:"Stage",items:[
"1. Ramatoulaye starts a long letter to Aissatou after Modou’s death.",
"2. She remembers her love and marriage and Aissatou’s refusal of polygamy.",
"3. Modou takes Binetou as a second wife, and Ramatoulaye endures.",
"4. After mourning customs, she rejects the proposals of Tamsir and Daouda.",
"5. She reflects on her children and modern life, and ends with hope."]},
"Nervous Conditions":{label:"Stage",items:[
"1. Tambu’s brother Nhamo dies, so she goes to the mission school.",
"2. At Babamukuru’s house she sees Nyasha struggle with her identity.",
"3. Maiguru and Lucia show different ways of living with male power.",
"4. Tambu grows more aware of what education and colonialism cost."]},
"Cry, the Beloved Country":{label:"Stage",items:[
"1. Stephen Kumalo travels from Ndotsheni to Johannesburg to find his son and sister.",
"2. He finds Gertrude and learns that Absalom is in trouble.",
"3. Arthur Jarvis is killed and Absalom is arrested.",
"4. At the trial, Absalom is sentenced and Kumalo returns home.",
"5. James Jarvis learns of his son’s ideals and helps the village."]},
"The Beautyful Ones Are Not Yet Born":{label:"Stage",items:[
"1. The Man, an honest railway clerk, refuses bribes while his wife Oyo wants more.",
"2. The corrupt party man Koomson grows rich and tempts the Man.",
"3. A coup topples the government, and Koomson must flee with the Man’s help."]},
"Season of Anomy":{label:"Stage",items:[
"1. Ofeyi, a poet and advertising executive, deals with the Cartel and the community of Aiyéró.",
"2. His lover Iriyise is kidnapped, and he searches amid violence.",
"3. The story ends in confrontation between the community and corrupt powers."]},
"The Famished Road":{label:"Stage",items:[
"1. Azaro, a spirit-child, chooses to stay with the living.",
"2. His parents struggle with poverty, and Madame Koto’s bar rises.",
"3. Political parties bring violence, and spirits follow Azaro.",
"4. Despite hardship, Azaro holds on to hope."]}
};

function calcEval(src){
  let i = 0; const t = String(src).replace(/\s+/g,"");
  const peek = () => t[i];
  const num = () => { const st = i; while(i < t.length && /[0-9.]/.test(t[i])) i++; if(st === i) throw 0; return parseFloat(t.slice(st,i)); };
  const factor = () => { if(peek() === "-"){ i++; return -factor(); } if(peek() === "("){ i++; const v = expr(); if(peek() !== ")") throw 0; i++; return v; } let v = num(); while(peek() === "%"){ i++; v /= 100; } return v; };
  const term = () => { let v = factor(); while(peek() === "*" || peek() === "/"){ const o = t[i++]; const r = factor(); v = o === "*" ? v*r : v/r; } return v; };
  const expr = () => { let v = term(); while(peek() === "+" || peek() === "-"){ const o = t[i++]; const r = term(); v = o === "+" ? v+r : v-r; } return v; };
  const v = expr(); if(i < t.length) throw 0; return v;
}
function calcKey(k){
  if(k === "C"){ calcExpr = ""; calcOut = "0"; }
  else if(k === "⌫"){ calcExpr = calcExpr.slice(0,-1); calcOut = calcExpr || "0"; }
  else if(k === "="){ try { const v = calcEval(calcExpr); calcOut = String(+v.toFixed(10)); calcExpr = isFinite(v) ? calcOut : ""; } catch(e){ calcOut = "Error"; calcExpr = ""; } }
  else { calcExpr += k; calcOut = calcExpr; }
  const d = document.getElementById("calcOut"); if(d) d.textContent = calcOut;
}

function photoChosen(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  if(S.view === "register") syncReg();   // keep what the user already typed
  const finish = (img) => {
    try{
      const c = document.createElement("canvas"); const n = 240; c.width = n; c.height = n; const g = c.getContext("2d");
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height; const m = Math.min(w, h);
      g.drawImage(img, (w - m)/2, (h - m)/2, m, m, 0, 0, n, n);
      setPhoto(c.toDataURL("image/jpeg", 0.85));
    }catch(e){ photoFail("Could not use that picture. Please choose a JPG or PNG photo."); }
  };
  const viaReader = () => {
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => finish(im); im.onerror = () => photoFail("Could not read that picture. Please choose a JPG or PNG photo."); im.src = rd.result; };
    rd.onerror = () => photoFail("Could not read that picture.");
    rd.readAsDataURL(f);
  };
  try{
    const url = URL.createObjectURL(f); const im = new Image();   // light on memory, works for big phone photos
    im.onload = () => { finish(im); try{ URL.revokeObjectURL(url); }catch(e){} };
    im.onerror = () => { try{ URL.revokeObjectURL(url); }catch(e){} viaReader(); };
    im.src = url;
  }catch(e){ viaReader(); }
}

function offlineTutor(q){

  const found = [];

    const need = Math.min(2, words.length);
    const look = (x, label) => { const t = (x.q + " " + (x.p || "")).toLowerCase(); let sc = 0; for(const w of words) if(t.indexOf(w) >= 0) sc++; if(sc >= need) found.push({sc:sc, x:x, l:label}); };

  for(const f of found){ if(!seenQ[f.x.q]){ seenQ[f.x.q] = 1; top.push(f); } if(top.length >= 3) break; }
  if(!top.length) return calc + "I could not find a solved question that matches. Try different key words, or use Question Search.";

{s:"Chemistry",t:"Equilibrium constant Kc",d:"For A + B ⇌ C + D: Kc = [C][D] ÷ ([A][B])",c:[["A","[A]","mol/dm³",0.1,5,1,0.1],["B","[B]","mol/dm³",0.1,5,1,0.1],["C","[C]","mol/dm³",0.1,5,2,0.1],["D","[D]","mol/dm³",0.1,5,2,0.1]],f:x=>{const K=x.C*x.D/(x.A*x.B);return {K:K,note:K>1?"Products are favoured":(K<1?"Reactants are favoured":"Neither side is favoured")};},o:[["K","Kc",""],["note","Meaning",""]],p:["C","K","[C] (mol/dm³)","Kc"],n:"A large Kc means the reaction goes mostly to products."},

{s:"Chemistry",t:"Titration curve: HCl and NaOH",d:"pH while adding base to acid",c:[["Ca","Acid concentration","mol/dm³",0.05,0.5,0.1,0.05],["Va","Acid volume","cm³",10,50,25,1],["Cb","Base concentration","mol/dm³",0.05,0.5,0.1,0.05],["Vb","Base added","cm³",0,60,10,1]],f:x=>{const na=x.Ca*x.Va/1000,nb=x.Cb*x.Vb/1000,V=(x.Va+x.Vb)/1000;let pH;if(Math.abs(na-nb)<1e-9)pH=7;else if(na>nb)pH=-Math.log10((na-nb)/V);else pH=14+Math.log10((nb-na)/V);return {pH:pH,note:Math.abs(na-nb)<1e-9?"End point":(na>nb?"Still acidic":"Alkaline: base in excess")};},o:[["pH","pH of the mixture",""],["note","Stage",""]],p:["Vb","pH","Base added (cm³)","pH"],n:"The pH changes sharply near the end point."},

{s:"Biology",t:"Dihybrid cross",d:"Two genes, A and B, each with a dominant and a recessive allele",c:[{k:"a1",l:"Parent 1, gene A",sel:["AA","Aa","aa"],v:"Aa"},{k:"b1",l:"Parent 1, gene B",sel:["BB","Bb","bb"],v:"Bb"},{k:"a2",l:"Parent 2, gene A",sel:["AA","Aa","aa"],v:"Aa"},{k:"b2",l:"Parent 2, gene B",sel:["BB","Bb","bb"],v:"Bb"}],cu:x=>{const g=(a,b)=>{const r=[];for(const i of a)for(const j of b)r.push(i+j);return r;};const g1=g([x.a1[0],x.a1[1]],[x.b1[0],x.b1[1]]),g2=g([x.a2[0],x.a2[1]],[x.b2[0],x.b2[1]]);let c={AB:0,Ab:0,aB:0,ab:0};g1.forEach(p=>g2.forEach(q=>{const A=(p[0]==="A"||q[0]==="A"),B=(p[1]==="B"||q[1]==="B");c[(A?"A":"a")+(B?"B":"b")]++;}));return `<p>Gametes from parent 1: <b>${[...new Set(g1)].join(", ")}</b></p><p>Gametes from parent 2: <b>${[...new Set(g2)].join(", ")}</b></p><p>Phenotype ratio (both dominant : A dominant only : B dominant only : both recessive) = <b>${c.AB} : ${c.Ab} : ${c.aB} : ${c.ab}</b> out of 16</p>`;},n:"AaBb × AaBb gives the famous 9 : 3 : 3 : 1 ratio."},
{s:"Biology",t:"Blood group inheritance",d:"A and B are codominant. O is recessive.",c:[{k:"g1",l:"Parent 1 blood group",sel:["A","B","AB","O"],v:"A"},{k:"g2",l:"Parent 2 blood group",sel:["A","B","AB","O"],v:"B"}],cu:x=>{const gen={A:["AA","AO"],B:["BB","BO"],AB:["AB"],O:["OO"]};const ph=g=>(g.indexOf("A")>=0&&g.indexOf("B")>=0)?"AB":(g.indexOf("A")>=0?"A":(g.indexOf("B")>=0?"B":"O"));const set=new Set();gen[x.g1].forEach(a=>gen[x.g2].forEach(b=>{for(const i of a)for(const j of b)set.add(ph(i+j));}));return `<p>Possible blood groups of children: <b>${["A","B","AB","O"].filter(z=>set.has(z)).join(", ")}</b></p><p><small>The parents might be heterozygous (for example AO), so more than one group can be possible.</small></p>`;},n:"Two parents with group A can have a child with group O if both carry the O allele."},

{s:"Biology",t:"Predator and prey",d:"A simple Lotka–Volterra model",c:[["N0","Starting prey","",20,200,100,5],["P0","Starting predators","",2,50,10,1],["t","Time","units",0,60,20,1]],f:x=>{let N=x.N0,P=x.P0;const dt=0.05,steps=Math.round(x.t/dt);for(let i=0;i<steps;i++){const dN=(0.5*N-0.02*N*P)*dt,dP=(0.01*N*P-0.4*P)*dt;N=Math.max(0,N+dN);P=Math.max(0,P+dP);}return {N:N,P:P};},o:[["N","Prey",""],["P","Predators",""]],p:["t","N","Time","Prey population"],n:"Predator numbers rise and fall a little after prey numbers."},

function labPlot(pts,xl,yl,cur){
  if(!pts.length) return "";
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs), y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);
  if(x1 === x0) x1 = x0 + 1; if(y1 === y0) y1 = y0 + 1;
  const X = x => 44 + (x-x0)/(x1-x0)*240, Y = y => 140 - (y-y0)/(y1-y0)*120;
  const d = pts.map((p,i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  return `<line x1="44" y1="140" x2="288" y2="140" stroke="#888" stroke-width="1.5"/><line x1="44" y1="20" x2="44" y2="140" stroke="#888" stroke-width="1.5"/>
    <path d="${d}" fill="none" stroke="#e67e22" stroke-width="3"/>
    ${cur ? `<circle cx="${X(cur[0]).toFixed(1)}" cy="${Y(cur[1]).toFixed(1)}" r="5" fill="#0b6e4f"/>` : ""}
    <text x="44" y="154" font-size="9" fill="currentColor">${labFmt(x0)}</text><text x="288" y="154" font-size="9" text-anchor="end" fill="currentColor">${labFmt(x1)}</text>
    <text x="40" y="140" font-size="9" text-anchor="end" fill="currentColor">${labFmt(y0)}</text><text x="40" y="24" font-size="9" text-anchor="end" fill="currentColor">${labFmt(y1)}</text>
    <text x="166" y="166" font-size="10" text-anchor="middle" fill="currentColor">${xl}</text><text x="8" y="80" font-size="10" fill="currentColor" transform="rotate(-90 8 80)" text-anchor="middle">${yl}</text>`;
}

function labSet(k,v){
  const L = LABS[S.lab], c = L.c.find(z => z.k === k);
  S.vals[k] = c.sel ? v : +v;
  const e = document.getElementById("lv_" + k); if(e) e.textContent = S.vals[k];

}
function labUpdate(){
  const L = LABS[S.lab], out = document.getElementById("labout"); if(!out) return;
  const r = L.f ? L.f(S.vals) : {};
  out.innerHTML = L.cu ? L.cu(S.vals) : L.o.map(o => `<p>${o[1]}: <b>${labFmt(r[o[0]])}</b> ${o[2] || ""}</p>`).join("");
  const svg = document.getElementById("labplot"); if(!svg || !(L.p || L.cv)) return;
  let pts, xl, yl, cur = null;
  if(L.cv){ const c = L.cv(S.vals); pts = c.pts; xl = c.xl; yl = c.yl; }
  else {
    const cx = L.c.find(c => c.k === L.p[0]); pts = [];
    for(let i = 0; i <= 40; i++){ const xv = cx.min + (cx.max-cx.min)*i/40; const y = L.f(Object.assign({}, S.vals, {[cx.k]:xv}))[L.p[1]]; if(isFinite(y) && Math.abs(y) < (L.clip || 1e9)) pts.push([xv,y]); }
    xl = L.p[2]; yl = L.p[3]; const yc = r[L.p[1]]; cur = isFinite(yc) ? [S.vals[cx.k], yc] : null;
  }
  svg.innerHTML = labPlot(pts,xl,yl,cur);
}

  }
  if(S.view === "tutor"){
    h += `<div class="card"><h2>🤖 ${AI_MODE !== "none" ? "AI Tutor" : "Study Helper"}</h2><p><small>${AI_MODE !== "none" ? "Ask a school question and get a step-by-step explanation." : "Type a question. The helper finds solved questions in the app that match it and can work out simple sums."}</small></p>
      <textarea id="tq" rows="3" placeholder="Type your question, for example: Explain Ohm’s law with an example" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px"></textarea>
      <button onclick="tutorAsk()">Ask the tutor</button><button class="alt" onclick="go('home')">Back</button></div>`;
    (S.chat || []).slice().reverse().forEach(c => { h += `<div class="card"><b>You:</b> ${esc(c.q)}<br><br><b>${c.ai ? "AI Tutor" : "Tutor"}:</b> ${esc(c.a).replace(/\n/g,"<br>")}</div>`; });
  }
  if(S.view === "history"){
    const a = attempts();
    const avg = a.length ? Math.round(a.reduce((n,x) => n + x.sc/x.t*100, 0)/a.length) : 0;
    h += `<div class="card"><h2>📊 Score history</h2>
      ${a.length ? `<p>${a.length} practice${a.length>1?"s":""} saved • Average ${avg}%</p>` : "<p>No practice saved yet. Finish a practice and it will appear here.</p>"}
      ${a.map(x => { const p = Math.round(x.sc/x.t*100); return `<div class="item" onclick="openReview(${x.id})"><b>${x.s}</b> • ${x.y}<br><small>${x.d}</small><br>Score: <b class="${p>=50?"good":"badc"}">${x.sc}/${x.t} (${p}%)</b> <small>• tap to see corrections</small></div>`; }).join("")}
      <button class="alt" onclick="go('home')">Back</button>${a.length ? `<button class="alt" onclick="clearHistory()">Clear history</button>` : ""}</div>`;
  }
  if(S.view === "review"){
    const a = S.rv;
    const wrong = a.qs.filter(q => q.p !== q.a).length;
    h += `<div class="card"><h3>${a.s} • ${a.y}</h3><p>${a.d} • Score <b>${a.sc}/${a.t}</b> • ${wrong} to correct</p>
      <button onclick="toggleWrong()">${S.onlyWrong ? "Show all questions" : "Show only wrong answers"}</button>
      <button class="alt" onclick="go('history')">Back to history</button></div>`;
    a.qs.forEach((q,i) => {
      if(S.onlyWrong && q.p === q.a) return;
      h += `<div class="card"><small>Question ${i+1}</small><h3>${q.q}</h3>${q.o.map((o,n) => `<div class="opt ${n===q.a?"right":(n===q.p?"wrong":"")}">${"ABCDE"[n]}. ${o}${n===q.a?" ✔ correct":""}${(n===q.p && n!==q.a)?" ✖ your answer":""}</div>`).join("")}${q.p===-1 ? `<p><small>You did not answer this question.</small></p>` : ""}<div class="sol"><b>Correction:</b> ${q.s}</div></div>`;
    });
  }
  if(S.view === "novels"){
    h += `<div class="card"><h2>📚 Novel library</h2><p><small>Short study summaries in my own words. Read the full novels from a book or library, and check your official JAMB or WAEC syllabus for the set texts.</small></p>
      ${NOVELS.map((n,i) => `<button class="alt" onclick="openNovel(${i})">${n.tag ? "⭐ " : ""}${i+1}. ${n.t} — ${n.a}</button>`).join("")}
      <button onclick="go('home')">Back</button></div>`;
  }
  if(S.view === "novel"){
    const n = NOVELS[S.ni];
    h += `<div class="card"><h2>${n.t}</h2>${n.tag ? `<p><span class="tag">⭐ ${n.tag}</span></p>` : ""}<p><b>Author:</b> ${n.a}${n.y ? `<br><b>Year:</b> ${n.y}` : ""}</p><p>${n.sum}</p><p><b>Themes:</b> ${n.th.join(", ")}</p><p><b>Main characters:</b> ${n.ch.join(", ")}</p>
      ${chaptersHtml(n.t)}
      <button onclick="startNovel(${S.ni})">📝 JAMB Novel Practice (${(PRACTICE[n.t] || []).length} questions)</button>
      <p><small>You see the solution right after you answer each question.</small></p>
      <div class="row"><button class="alt" onclick="openNovel(${(S.ni+NOVELS.length-1)%NOVELS.length})">◀ Previous</button><button class="alt" onclick="openNovel(${(S.ni+1)%NOVELS.length})">Next ▶</button></div>
      <button onclick="go('novels')">All novels</button></div>`;
  }
  if(S.view === "support"){
    const p = profile();
    h += `<div class="card"><h2>💬 Support</h2><p>Need help with activation, payment or a question? Contact us:</p>
      <p><b>${CONFIG.email}</b></p>
      <button onclick="supportMail()">📧 Open my email app</button>
      <button class="alt" onclick="copyEmail()">📋 Copy email address</button>
      ${S.msg ? `<p><small>${S.msg}</small></p>` : ""}
      <h3>Quick help</h3>
      <p><b>How do I activate?</b><br>Tap Activate, pay as shown, then send your payment receipt and Device ID to the email above. You will receive your unlock code.</p>
      <p><b>My Device ID</b><br>${deviceId()}</p>
      <button class="alt" onclick="go('home')">Back</button></div>`;
  }
  if(S.view === "bookmarks"){
    const b = bms();
    h += `<div class="card"><h2>🔖 Bookmarked questions</h2>${b.length ? `<p>${b.length} saved</p><button onclick="practiceBm()">Practise these questions</button>` : "<p>No bookmarks yet. Tap the 🔖 button on any question to save it.</p>"}<button class="alt" onclick="go('home')">Back</button></div>`;
    b.forEach((x,i) => {
      h += `<div class="card"><small>${esc(x.sub || "")}</small>${x.p ? `<div class="passage"><b>PASSAGE</b><p>${x.p}</p></div>` : ""}<h3>${x.q}</h3>${x.o.map((o,k) => `<div class="opt ${k === x.a ? "right" : ""}">${"ABCDE"[k]}. ${o}${k === x.a ? " ✔ correct" : ""}</div>`).join("")}<div class="sol"><b>Solution:</b> ${x.s}</div><button class="alt" onclick="removeBm(${i})">Remove bookmark</button></div>`;
    });
  }
  if(S.view === "analysis"){
    const a = attempts();
    h += `<div class="card"><h2>📈 Performance analysis</h2>`;
    if(!a.length){ h += `<p>No practice saved yet. Finish a practice to see your analysis.</p>`; }
    else {
      const by = {};
      a.forEach(x => { const k = x.s.indexOf("Novel: ") === 0 ? "Novel practice" : x.s; (by[k] = by[k] || []).push(Math.round(x.sc/x.t*100)); });
      const rows = Object.keys(by).map(k => ({k:k, n:by[k].length, avg:Math.round(by[k].reduce((t,v) => t+v, 0)/by[k].length), best:Math.max.apply(null, by[k])}));
      rows.sort((x,y) => x.avg - y.avg);
      const overall = Math.round(a.reduce((n,x) => n + x.sc/x.t*100, 0)/a.length);
      h += `<p>Overall average: <b>${overall}%</b> from ${a.length} practice${a.length > 1 ? "s" : ""}</p><p>Weakest: <b>${esc(rows[0].k)}</b> (${rows[0].avg}%)${rows.length > 1 ? `<br>Strongest: <b>${esc(rows[rows.length-1].k)}</b> (${rows[rows.length-1].avg}%)` : ""}</p>`;
      rows.forEach(r => { h += `<div style="margin-top:10px"><small>${esc(r.k)} • ${r.n} practice${r.n > 1 ? "s" : ""} • best ${r.best}%</small><div class="bar"><div class="fill ${r.avg >= 50 ? "g" : "r"}" style="width:${r.avg}%"></div></div><small>Average ${r.avg}%</small></div>`; });
      h += `<p><small>Latest scores (oldest to newest):</small><br>${a.slice(0,8).reverse().map(x => Math.round(x.sc/x.t*100) + "%").join(" → ")}</p>`;
    }
    h += `<button class="alt" onclick="go('home')">Back</button></div>`;
  }
  if(S.view === "games"){
    h += `<div class="card"><h2>🎮 Educational games</h2><p><b>Speed Round</b><br>Answer as many questions as you can in 60 seconds from your subjects.</p><p>Best score: <b>${sget("chocos_game") || 0}</b></p><button onclick="startGame()">▶ Play Speed Round</button><button class="alt" onclick="go('home')">Back</button></div>`;
  }
  if(S.view === "game"){
    const q = S.q;
    h += `<div class="qbar"><button class="ib" onclick="goBack()" aria-label="Back">←</button><span class="qpill" style="flex:1">Score ${S.score} • Answered ${S.done}</span><span class="timer" id="clock">${fmt(S.time)}</span></div>`;
    h += `<div class="card"><small>${esc(q.sub)}</small><h3>${q.q}</h3>${q.o.map((o,k) => { let c = "alt"; if(S.fb !== null){ if(k === q.a) c = "ok"; else if(k === S.fb) c = "bad"; } return `<button class="${c}" onclick="gameAnswer(${k})">${"ABCDE"[k]}. ${o}</button>`; }).join("")}</div>`;
  }
  if(S.view === "gameover"){
    h += `<div class="card"><h2>⏱ Time up!</h2><p>You scored <b>${S.score}</b> from ${S.done} questions.</p><p>Best score: <b>${S.best}</b></p><button onclick="startGame()">Play again</button><button class="alt" onclick="go('games')">Back to games</button></div>`;
  }
  if(S.view === "leaderboard"){
    const a = attempts(); const best = {};
    a.forEach(x => { const k = x.s; const pc = Math.round(x.sc/x.t*100); if(!best[k] || pc > best[k]) best[k] = pc; });
    const rows = Object.keys(best).map(k => ({k:k, p:best[k]})).sort((x,y) => y.p - x.p).slice(0,10);
    h += `<div class="card"><h2>🥇 Leaderboard</h2>`;
    if(FB.ready){
      h += `<h3>🌍 Top students</h3>${S.board ? (S.board.length ? S.board.map((b,i) => `<p>${i+1}. <b>${esc(b.name || "Student")}</b>${b.state ? " (" + esc(b.state) + ")" : ""} — ${b.points || 0} points</p>`).join("") : "<p>No scores yet.</p>") : "<p>Loading…</p>"}`;
    } else { h += `<p><small>The online leaderboard is not switched on in this version. Your own best scores are below.</small></p>`; }
    h += `<h3>Your best scores</h3>${rows.length ? rows.map((r,i) => `<p>${i+1}. <b>${esc(r.k)}</b> — ${r.p}%</p>`).join("") : "<p>No scores yet. Finish a practice to see your best scores here.</p>"}<button class="alt" onclick="go('home')">Back</button></div>`;
  }
  if(S.view === "career"){
    const C = [["Medicine and Surgery","English, Biology, Chemistry, Physics"],["Pharmacy","English, Biology, Chemistry, Physics"],["Nursing Science","English, Biology, Chemistry, Physics"],["Engineering (most types)","English, Mathematics, Physics, Chemistry"],["Computer Science","English, Mathematics, Physics, plus one of Chemistry, Biology, Economics, Geography or Agricultural Science"],["Accounting and Banking and Finance","English, Mathematics, Economics, plus one of Commerce, Financial Accounting, Government or Geography"],["Economics","English, Mathematics, Economics, plus one of Government, Geography or Commerce"],["Law","English, Literature in English, Government, plus CRS or IRS (some schools accept Economics or Commerce)"],["Mass Communication","English, Literature in English, Government, plus one of CRS, IRS, Economics or Commerce"],["Agriculture","English, Chemistry, Biology or Agricultural Science, plus Physics or Mathematics"]];
    h += `<div class="card"><h2>🧭 Career guide</h2><p><small>A general guide only. Every university and course sets its own requirements. Always confirm in the current JAMB brochure for your school.</small></p>${C.map(c => `<p><b>${c[0]}</b><br>${c[1]}</p>`).join("")}<button class="alt" onclick="go('home')">Back</button></div>`;
  }
  if(S.view === "labs"){
    const ls = S.ls || "Physics";
    h += `<div class="card"><h2>🧪 Virtual labs</h2><p><small>30 experiments in each subject. Move the sliders and watch the results.</small></p><div class="chips" style="margin-bottom:8px">${["Physics","Chemistry","Biology"].map(n => `<span class="chip ${n === ls ? "on" : ""}" onclick="labSub('${n}')">${n}</span>`).join("")}</div>
      ${LABS.map((L,i) => L.s === ls ? `<button class="alt" onclick="labOpen(${i})">${LABS.filter((x,j) => j <= i && x.s === ls).length}. ${L.t}</button>` : "").join("")}
      <button class="alt" onclick="go('home')">Back</button></div>`;
  }
  if(S.view === "lab"){
    const L = LABS[S.lab];
    h += `<div class="card"><small>${L.s}</small><h2>${L.t}</h2><p><b>${L.d}</b></p>
      ${L.c.map(c => c.sel ? `<label>${c.l}</label><select onchange="labSet('${c.k}',this.value)">${c.sel.map(o => `<option ${o === S.vals[c.k] ? "selected" : ""}>${o}</option>`).join("")}</select>` : `<label>${c.l}: <b id="lv_${c.k}">${S.vals[c.k]}</b> ${c.u || ""}</label><input type="range" min="${c.min}" max="${c.max}" step="${c.st}" value="${S.vals[c.k]}" oninput="labSet('${c.k}',this.value)">`).join("")}
      <div id="labout" style="margin-top:12px"></div>
      ${(L.p || L.cv) ? `<svg id="labplot" viewBox="0 0 300 172" width="100%" role="img" aria-label="Graph"></svg>` : ""}
      ${L.n ? `<div class="sol"><b>Observe:</b> ${L.n}</div>` : ""}
      <button class="alt" onclick="go('labs')">Back to labs</button></div>`;
  }
  if(S.view === "exam"){
    const E = EXAMS[S.ex];
    h += `<div class="card"><span class="tag">${isPaid() ? "Full access" : "Free: " + FREE_LIMIT + " questions per subject"}</span><h2>${E.name} questions</h2>
      <p>Choose a subject</p><select id="exsub" onchange="fillExam()">${SUBJECTS.map(x => `<option ${x === (S.cur || SUBJECTS[0]) ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
      ${isPaid() ? `<p>Choose a year</p><select id="exyr"></select><small id="exnote"></small>` : ""}
      ${S.msg ? `<p style="color:var(--warn)">${S.msg}</p>` : ""}
      <p><small>${E.note} They are not the official papers. Each paper has up to 50 questions.</small></p>
      <button onclick="startExamFromUI('practice')">Start practice (solutions after each answer)</button>
      <button class="alt" onclick="startExamFromUI('exam')">Start a timed exam</button>
      ${isPaid() ? "" : `<button class="alt" onclick="go('pay')">🔓 Unlock all questions - ₦${CONFIG.price.toLocaleString()}</button>`}
      <button class="alt" onclick="go('home')">Back to home</button></div>`;
  }
  if(S.view === "linkpage"){
    const L = S.lp;
    h += `<div class="card"><h2>${L.title}</h2><p>${esc(L.text)}</p>
      <a class="pill green" href="${esc(L.url)}" target="_blank" rel="noopener" style="display:block;margin:12px 0;padding:14px;border-radius:30px;text-align:center;color:#fff;font-weight:bold;text-decoration:none">${L.label}</a>
      <button class="alt" onclick="copyText(${JSON.stringify(L.copy).replace(/"/g,"&quot;")},'Copied.')">📋 Copy ${L.copy === L.url ? "the link" : "the message"}</button>
      <p><small>If the button does not open, copy the link and paste it in your browser or WhatsApp.</small></p>
      <button class="alt" onclick="go('home')">Back</button></div>`;
  }
  if(menuOpen) h += drawerHtml();
  if(S.toast) h += `<div class="toast">${esc(S.toast)}</div>`;
  const hd = document.querySelector ? document.querySelector("header") : null;
  if(hd) hd.style.display = (S.view === "splash") ? "none" : "";
  const bb = document.getElementById ? document.getElementById("backbtn") : null;
  if(bb && bb.style) bb.style.display = (["splash","home","quiz"].indexOf(S.view) >= 0 || (S.view === "register" && !S.editing)) ? "none" : "flex";
  const mb = document.getElementById ? document.getElementById("menubtn") : null;
  if(mb && mb.style) mb.style.display = (["splash","quiz"].indexOf(S.view) >= 0 || (S.view === "register" && !S.editing)) ? "none" : "flex";
  app.innerHTML = h;
  if(S.view === "practice") fillYears();
  if(S.view === "exam") fillExam();
  if(S.view === "lab") labUpdate();
}
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if(S.view==="home") render(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; if(S.view==="home") render(); });
function installApp(){ if(!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt = null; render(); }
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

render();
</script>
</body>
</html>
